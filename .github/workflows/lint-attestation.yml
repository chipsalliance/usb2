name: Lint attestation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions: {}

concurrency:
  group: lint-attestation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-attestation:
    name: Lint attestation
    runs-on: ubuntu-24.04
    steps:
      - name: Check pull request attestation
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY", "")
          pattern = re.compile(
              r"^ {0,3}- \[([ xX])\] I attest that lint results are clean "
              r"in local testing on this branch[ \t]*$",
              re.MULTILINE,
          )
          matches = pattern.findall(body)
          if len(matches) != 1 or matches[0].lower() != "x":
              print("::error::Check the lint attestation checkbox in the pull request description.")
              sys.exit(1)
          print("Lint attestation is checked.")
          PY
